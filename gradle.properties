# Project-wide Gradle settings. Settings configured in the IDE override this file.
# https://docs.gradle.org/current/userguide/build_environment.html
# https://developer.android.com/build/optimize-your-build

# Gradle daemon JVM. Setting jvmargs drops Gradle's defaults, so MaxMetaspaceSize and
# HeapDumpOnOutOfMemoryError must be set explicitly (https://github.com/gradle/gradle/issues/19750).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Run independent tasks in parallel; build IDE sync models in parallel (set explicitly since Gradle 9.4).
org.gradle.parallel=true
org.gradle.tooling.parallel=true

# Reuse task outputs and the configured task graph between builds.
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official
